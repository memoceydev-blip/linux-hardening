---
- name: CIS Level 1 Hardening, nftables (with Manager SSH), Auditd & Log Auditor Group
  hosts: all
  become: true

  vars:
    log_group: "log_auditors"

    # List of trusted management IPs or CIDR ranges allowed to SSH (port 22)
    manager_ips:
      - "192.168.1.10"
      - "10.0.0.0/24"

    install_packages:
      - aide
      - aide-common
      - apparmor
      - apparmor-utils
      - nftables
      - libpam-pwquality
      - chrony
      - rsyslog
      - systemd-journal-remote
      - auditd
      - audispd-plugins
      - sudo
      - acl

    remove_packages:
      - ufw
      - iptables-persistent
      - nis
      - rsh-server
      - rsh-client
      - talk
      - telnetd
      - telnet
      - tftp-server
      - xinetd
      - ldap-utils
      - ftp
      - avahi-daemon
      - cups
      - isc-dhcp-server
      - slapd
      - nfs-kernel-server
      - bind9
      - vsftpd
      - apache2
      - nginx
      - dovecot-imapd
      - samba
      - squid
      - snmpd

  tasks:
    - name: Import CIS Level 1 hardening, nftables, auditd, and log group tasks
      ansible.builtin.import_tasks: tasks/cis_hardening_tasks.yml

  handlers:
    - name: Reload nftables
      ansible.builtin.command:
        cmd: nft -f /etc/nftables.conf
      changed_when: true

    - name: Restart rsyslog
      ansible.builtin.systemd:
        name: rsyslog
        state: restarted

    - name: Load auditd rules
      ansible.builtin.command:
        cmd: augenrules --load
      changed_when: true
      failed_when: false # Avoid failing if CIS immutable mode (-e 2) requires a reboot

    - name: Restart auditd
      ansible.builtin.service:
        name: auditd
        state: restarted
        use: service
